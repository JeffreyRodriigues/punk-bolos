<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Punk Bolos — Nova senha</title>

  <!-- Ordem: temas primeiro (define as variáveis), depois o estilo do login -->
  <link rel="stylesheet" href="css/themes.css?v=12">
  <link rel="stylesheet" href="css/login.css?v=12">
</head>

<body class="login-body">

  <div class="login-shell">
    <div class="login-brand">
      <span class="login-logo" aria-hidden="true">🍰</span>
      <span class="login-brand-name">Punk Bolos</span>
    </div>

    <main class="login-card" role="main">
      <!-- Seção mostrada quando o link de recuperação é válido -->
      <div id="resetSection" class="login-section" hidden>
        <h1 class="login-title">Definir nova senha</h1>
        <p class="login-subtitle">Escolha uma nova senha para a sua conta.</p>

        <form id="resetForm" novalidate>
          <div class="login-field">
            <label for="reset-senha">Nova senha</label>
            <input id="reset-senha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
          </div>
          <div class="login-field">
            <label for="reset-confirma">Confirmar senha</label>
            <input id="reset-confirma" type="password" placeholder="Repita a senha" autocomplete="new-password">
          </div>
          <p id="reset-error" class="login-error" role="alert"></p>
          <button type="submit" class="login-btn">Salvar nova senha</button>
        </form>
      </div>

      <!-- Seção de status: sucesso ou link inválido -->
      <div id="statusSection" class="login-section" hidden>
        <p id="status-message" class="login-status-message" role="status"></p>
        <button type="button" id="goLoginBtn" class="login-btn">Ir para o login</button>
      </div>
    </main>

    <p class="login-note">Os dados ficam salvos na nuvem e são compartilhados entre os administradores.</p>
  </div>

  <!-- reset.js lê o token da URL e salva a nova senha no Supabase. -->
  <script type="module" src="js/modules/reset.js?v=13"></script>
</body>
</html>
